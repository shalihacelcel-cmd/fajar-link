<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px 0}
.container{width:90%;max-width:380px;text-align:center;padding:25px 18px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border-radius:25px;border:1px solid rgba(255,255,255,0.12);box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.avatar{width:95px;height:95px;border-radius:50%;border:3px solid #fff;object-fit:cover}
h1{margin-top:12px;font-size:22px;font-weight:700}
.type{color:#bbb;font-size:12px;height:18px;margin:4px 0 16px 0}
.links{display:flex;flex-direction:column;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:13px;color:white;text-decoration:none;font-weight:600;transition:.3s;font-size:12.5px}
.btn:hover{transform:scale(1.03);background:rgba(255,255,255,0.12)}
.music{position:fixed;bottom:18px;right:18px;width:48px;height:48px;background:white;color:black;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.music.playing{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<a class="btn" href="https://x.com/_gommybeer" target="_blank"><i class="fab fa-x-twitter"></i> X / Twitter</a>

</div>
<div class="music" id="musicBtn" onclick="toggleMusic()"><i class="fas fa-music" id="musicIcon"></i></div>
<audio id="audio" loop src="https://gachi.gay/BtdRfO"></audio>
<script>
const texts=["Welcome to my link","Find me on social media","Contact me below"];
let count=0,idx=0,isDeleting=false;
function type(){const f=texts[idx];let c=isDeleting?f.substring(0,count--):f.substring(0,count++);document.getElementById("typing").innerHTML=c;let s=isDeleting?50:100;if(!isDeleting&&count===f.length+1){s=1500;isDeleting=true}else if(isDeleting&&count===0){isDeleting=false;idx=(idx+1)%texts.length;s=500}setTimeout(type,s)}type();
let playing=false;const audio=document.getElementById("audio"),icon=document.getElementById("musicIcon"),btn=document.getElementById("musicBtn");
function toggleMusic(){if(!playing){audio.play();icon.className="fas fa-pause";btn.classList.add("playing");playing=true}else{audio.pause();icon.className="fas fa-music";btn.classList.remove("playing");playing=false}}
document.body.addEventListener('click',function firstPlay(){if(!playing)toggleMusic();document.body.removeEventListener('click',firstPlay)},{once:true});
</script>
