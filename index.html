<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fajar - GommyBeer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#050505;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative}
.bg{position:fixed;width:100%;height:100%;background:radial-gradient(circle at 30% 20%,#1a1a40 0%,transparent 50%),radial-gradient(circle at 80% 80%,#4a1942 0%,transparent 50%),#050505;z-index:-1}
.container{width:90%;max-width:380px;text-align:center;padding:30px 20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(15px);border-radius:25px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 10px 40px rgba(0,0,0,0.5);animation:fadeIn 1s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:110px;height:110px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px rgba(255,255,255,0.4);object-fit:cover;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin-top:15px;font-size:24px;font-weight:700}
.type{color:#aaa;font-size:13px;height:20px;margin:5px 0 20px 0}
.links{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:14px;color:white;text-decoration:none;font-weight:600;transition:0.3s}
.btn:hover{transform:scale(1.03);background:rgba(255,255,255,0.15)}
.btn.tele:hover{background:#229ED9;border-color:#229ED9}
.btn.insta:hover{background:linear-gradient(45deg,#f09433,#dc2743);border-color:transparent}
.btn i{font-size:20px}
.music{position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:white;color:black;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.7)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
<img class="avatar" src="https://cdn.nekohime.site/file/cnohs01y.jpeg">
<h1>Fajar</h1>
<div class="type" id="typing"></div>
<div class="links">
<a class="btn tele" href="https://t.me/tutuaja" target="_blank"><i class="fab fa-telegram"></i> Telegram Pribadi</a>
<a class="btn insta" href="https://instagram.com/_gommybeer" target="_blank"><i class="fab fa-instagram"></i> @_gommybeer</a>
<a class="btn" href="https://t.me/allinfofajar" target="_blank"><i class="fas fa-bullhorn"></i> Channel Info</a>
</div>
<p style="margin-top:20px;font-size:10px;color:#555">🎵 Dimas M - Kau Lukis Aku</p>
<p style="margin-top:5px;font-size:11px;color:#666">© 2026 Fajar • Mendahara Ilir</p>
</div>

<div class="music" onclick="toggleMusic()"><i class="fas fa-music" id="musicIcon"></i></div>
<audio id="audio" loop src="https://cdn.nekohime.site/file/5pzcd8sx.mp3"></audio>

<script>
const texts=["Welcome to my link","Kau lukis aku dengan cintamu","Mendahara Ilir"];
let count=0,idx=0,isDeleting=false;
function type(){const full=texts[idx];let current=isDeleting?full.substring(0,count--):full.substring(0,count++);document.getElementById("typing").innerHTML=current;let speed=isDeleting?50:100;if(!isDeleting&&count===full.length+1){speed=1500;isDeleting=true}else if(isDeleting&&count===0){isDeleting=false;idx=(idx+1)%texts.length;speed=500}setTimeout(type,speed)}type();

let playing=false;
function toggleMusic(){
  const a=document.getElementById("audio");
  const ic=document.getElementById("musicIcon");
  if(!playing){a.play();ic.className="fas fa-pause";playing=true}
  else{a.pause();ic.className="fas fa-music";playing=false}
}
// Autoplay saat klik pertama dimana saja (biar gak diblok browser)
document.body.addEventListener('click',()=>{if(!playing){toggleMusic()}},{once:true});
</script>
</body>
</html>
